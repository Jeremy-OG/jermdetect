global:
  resolve_timeout: 5m

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'slack-notifications'

receivers:
  - name: 'slack-notifications'
    slack_configs:
      - api_url: 'http://placeholder-url' # Docker intercepts this and swaps it with the real token
        channel: '#jermdetect-alerts'
        send_resolved: true
        text: "🚨 *Alert:* {{ .CommonAnnotations.summary }}\n📌 *Description:* {{ .CommonAnnotations.description }}\n🔥 *Severity:* {{ .CommonLabels.severity }}"